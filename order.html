<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Moon's Gallery</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
<h1>Moon's Gallery</h1>
<p>Complete Your Order</p>
</header>

<div class="order-box">

<h2>Order Information</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<textarea placeholder="Full Address"></textarea>

<select>
<option>Dhaka</option>
<option>Outside Dhaka</option>
</select>

<select>
<option>Quantity: 1</option>
<option>Quantity: 2</option>
<option>Quantity: 3</option>
<option>Quantity: 4</option>
<option>Quantity: 5</option>
</select>

<select>
<option>Cash on Delivery</option>
<option>bKash</option>
<option>Nagad</option>
</select>

<textarea placeholder="Additional Note (Optional)"></textarea>

<button type="submit">Place Order</button>

</form>

</div>

</body>
</html>

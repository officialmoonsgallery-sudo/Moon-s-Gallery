<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Moon's Gallery</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
<h1>Moon's Gallery</h1>
<p>Complete Your Order</p>
</header>

<div class="order-box">

<h2>Order Information</h2>

<form id="orderForm">

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<textarea placeholder="Full Address"></textarea>

<select>
<option>Dhaka</option>
<option>Outside Dhaka</option>
</select>

<select>
<option>Quantity: 1</option>
<option>Quantity: 2</option>
<option>Quantity: 3</option>
<option>Quantity: 4</option>
<option>Quantity: 5</option>
</select>

<textarea placeholder="Additional Note (Optional)"></textarea>

<button type="button" onclick="submitOrder()">Place Order</button>
<h3>Order Summary</h3>

<p><strong>Product:</strong> <span id="product"></span></p>

<p><strong>Color:</strong> <span id="color"></span></p>

<p><strong>Price:</strong> ৳<span id="price"></span></p>

<p><strong>Delivery:</strong> ৳<span id="delivery">80</span></p>

<h2>Total: ৳<span id="total"></span></h2>
</form>

</div>
<script>
const product = localStorage.getItem("product");
const color = localStorage.getItem("color");
const price = Number(localStorage.getItem("price"));

document.getElementById("product").innerText = product;
document.getElementById("color").innerText = color;
document.getElementById("price").innerText = price;
document.getElementById("total").innerText = price + 80;
</script>
</body>
</html>
